[project]
name = "pension-portfolio-dashboard"
version = "1.0.0"
description = "Simple Korean pension-account portfolio and ETF performance dashboard"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.39,<2.0",
  "pandas>=2.1,<4.0",
  "openpyxl>=3.1,<4.0",
  "yfinance>=0.2",
  "supabase>=2.0,<3.0",
  "plotly>=5.22,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
